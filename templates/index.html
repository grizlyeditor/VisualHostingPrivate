<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Bot Hosting</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --text: #c9d1d9;
            --primary: #58a6ff;
            --success: #238636;
            --border: #30363d;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Courier New', monospace;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        button {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            opacity: 0.9;
        }
        #terminal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }
        .terminal-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
        .user-id {
            font-family: monospace;
            color: var(--primary);
            background: rgba(88, 166, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>Multi-User Bot Hosting</h1>
            <p>Your User ID: <span class="user-id" id="user-id"></span></p>
        </div>
        
        <div class="panel">
            <h2>Upload Your Bot</h2>
            <div class="form-group">
                <label for="bot-file">Python File (bot.py)</label>
                <input type="file" id="bot-file" accept=".py">
            </div>
            <button id="upload-btn">Upload File</button>
        </div>
        
        <div class="panel">
            <h2>Or Paste Code Directly</h2>
            <div class="form-group">
                <label for="bot-token">Telegram Bot Token</label>
                <input type="text" id="bot-token" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
            </div>
            <div class="form-group">
                <label for="bot-code">Python Code</label>
                <textarea id="bot-code" spellcheck="false">import telebot

bot = telebot.TeleBot("YOUR_TOKEN_HERE")

@bot.message_handler(commands=['start'])
def send_welcome(message):
    bot.reply_to(message, "Hello from your personal bot!")

# Add your handlers here</textarea>
            </div>
            <button id="run-btn">Start Bot</button>
        </div>
        
        <div class="panel">
            <h2>Output</h2>
            <div id="terminal">
                <div class="terminal-line">Ready to host your bot...</div>
            </div>
        </div>
    </div>

    <script>
        // Display user ID
        document.getElementById('user-id').textContent = sessionStorage.getItem('user_id') || 'generating...';
        
        // Generate user ID if not exists
        if (!sessionStorage.getItem('user_id')) {
            fetch('/')
                .then(() => {
                    fetch('/get-user-id')
                        .then(res => res.json())
                        .then(data => {
                            sessionStorage.setItem('user_id', data.user_id);
                            document.getElementById('user-id').textContent = data.user_id;
                        });
                });
        }

        // File upload
        document.getElementById('upload-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('bot-file');
            const file = fileInput.files[0];
            
            if (!file) {
                addToTerminal('Error: No file selected');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    addToTerminal(`Error: ${data.error}`);
                } else {
                    addToTerminal(`File ${data.filename} uploaded for user ${data.user_id}`);
                    // Load file content into editor
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById('bot-code').value = e.target.result;
                    };
                    reader.readAsText(file);
                }
            })
            .catch(error => {
                addToTerminal(`Upload failed: ${error.message}`);
            });
        });

        // Run bot
        document.getElementById('run-btn').addEventListener('click', () => {
            const code = document.getElementById('bot-code').value;
            const token = document.getElementById('bot-token').value;
            
            if (!token) {
                addToTerminal('Error: Bot token is required');
                return;
            }
            
            addToTerminal('Starting your bot...');
            
            fetch('/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    code: code,
                    token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    addToTerminal(`Error: ${data.error}`);
                } else {
                    addToTerminal(`Bot started successfully for user ${data.user_id}`);
                    addToTerminal('Your bot is now running in the background');
                }
            })
            .catch(error => {
                addToTerminal(`Error: ${error.message}`);
            });
        });

        function addToTerminal(message) {
            const terminal = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.textContent = message;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
                  </html>
