<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Bot Runner</title>
    <style>
        body { background: linear-gradient(to right, #2c003e, #6f00a8); color: white; font-family: sans-serif; padding: 20px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .upload-section { margin-bottom: 20px; }
        .button { padding: 10px 20px; margin-top: 10px; background-color: #9900ff; border: none; color: white; cursor: pointer; }
        .console-box { background-color: #1a0033; padding: 15px; white-space: pre-wrap; height: 300px; overflow-y: scroll; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="topbar">
        <h2>Visual Hosting</h2>
        <div>⋮</div>
    </div>

    <div class="upload-section">
        <form method="POST" enctype="multipart/form-data">
            <label>Upload Python Bot File:</label><br>
            <input type="file" name="botfile" accept=".py"><br>
            <button class="button" type="submit">Upload</button>
        </form>
    </div>

    <form method="POST" action="/start">
        <button class="button" type="submit">🚀 Start Bot</button>
    </form>

    <h3>🖥️ Console Output:</h3>
    <div class="console-box" id="console">{{ log_data }}</div>

    <script>
        setInterval(() => {
            fetch('/log')
                .then(res => res.text())
                .then(data => document.getElementById('console').innerText = data);
        }, 2000);
    </script>
</body>
</html>
