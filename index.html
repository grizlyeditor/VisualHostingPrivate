<!DOCTYPE html>
<html>
<head>
  <title>Telegram Bot Host</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button, input { font-size: 16px; padding: 10px; margin: 10px; }
  </style>
</head>
<body>
  <h2>Upload Your Python Bot (.py)</h2>
  <input type="file" id="fileInput" accept=".py"><br>
  <button onclick="uploadFile()">📤 Upload</button>

  <div id="startArea" style="display:none;">
    <br><button onclick="startBot()">▶️ Start Bot</button>
    <p>⏱ Running: <span id="timer">0</span> sec</p>
  </div>

  <script>
    let timerInterval;
    let seconds = 0;

    async function uploadFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file || !file.name.endsWith(".py")) {
        alert("Please upload a .py file.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.status === 'success') {
        alert("✅ File uploaded!");
        document.getElementById("startArea").style.display = "block";
      }
    }

    async function startBot() {
      const res = await fetch('/start', { method: 'POST' });
      const data = await res.json();
      if (data.status === 'started') {
        alert("✅ Bot started!");
        seconds = 0;
        timerInterval = setInterval(() => {
          seconds++;
          document.getElementById("timer").innerText = seconds;
        }, 1000);
      }
    }
  </script>
</body>
</html>
