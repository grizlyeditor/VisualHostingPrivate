<!DOCTYPE html>
<html>
<head>
  <title>Visual Bot Hosting</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f8f9fa; }
    h1 { font-size: 28px; margin-bottom: 20px; }
    button { padding: 10px 18px; font-size: 16px; border-radius: 5px; border: none; cursor: pointer; }
    #fileTable { margin-top: 20px; border-collapse: collapse; width: 100%; }
    th, td { padding: 12px 16px; border: 1px solid #ddd; }
    th { background: #f0f0f0; }
    .dots { font-size: 20px; cursor: pointer; }
    .dropdown { display: none; position: absolute; background: white; border: 1px solid #ccc; padding: 10px; z-index: 1; }
    .dropdown button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 6px 0; cursor: pointer; }
  </style>
</head>
<body>

  <h1>📂 Visual Bot Hosting</h1>

  <input type="file" id="fileInput" accept=".py">
  <button style="background:#007bff; color:white;" onclick="upload()">Upload File</button>

  <table id="fileTable" style="display:none;">
    <thead>
      <tr><th>Name</th><th>Actions</th><th>Timer</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div id="dropdown" class="dropdown">
    <button onclick="startBot()">▶️ Start</button>
    <button onclick="stopBot()">🛑 Stop</button>
  </div>

  <script>
    let uploadedFile = null;
    let timer = 0;
    let interval = null;
    let currentRow = null;

    async function upload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file || !file.name.endsWith('.py')) return alert("Upload a .py file");

      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();

      if (data.status === "success") {
        uploadedFile = file.name;
        document.getElementById("fileTable").style.display = "table";
        document.getElementById("tableBody").innerHTML = `
          <tr>
            <td>${uploadedFile}</td>
            <td><span class="dots" onclick="showMenu(event)">⋮</span></td>
            <td><span id="timer">0s</span></td>
          </tr>`;
      } else {
        alert("Upload failed");
      }
    }

    function showMenu(e) {
      const dropdown = document.getElementById("dropdown");
      dropdown.style.top = e.clientY + "px";
      dropdown.style.left = e.clientX + "px";
      dropdown.style.display = "block";
    }

    async function startBot() {
      const res = await fetch("/start", { method: "POST" });
      const data = await res.json();
      if (data.status === "started") {
        startTimer();
        alert("Bot started!");
      }
      document.getElementById("dropdown").style.display = "none";
    }

    async function stopBot() {
      const res = await fetch("/stop", { method: "POST" });
      const data = await res.json();
      if (data.status === "stopped") {
        stopTimer();
        alert("Bot stopped.");
      }
      document.getElementById("dropdown").style.display = "none";
    }

    function startTimer() {
      timer = 0;
      interval = setInterval(() => {
        timer++;
        document.getElementById("timer").innerText = `${timer}s`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(interval);
      document.getElementById("timer").innerText = "0s";
    }

    window.onclick = function(e) {
      if (!e.target.matches('.dots')) {
        document.getElementById("dropdown").style.display = "none";
      }
    }
  </script>

</body>
</html>
