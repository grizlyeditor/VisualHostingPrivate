<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Runner</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --surface: #252526;
            --text: #e0e0e0;
            --primary: #007acc;
            --success: #4CAF50;
            --border: #333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-upload {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-upload {
            background: var(--primary);
            color: white;
        }
        .btn-run {
            background: var(--success);
            color: white;
        }
        #code-editor {
            width: 100%;
            height: 300px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
        }
        #terminal {
            width: 100%;
            height: 200px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
        }
        .terminal-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Python Code Runner</h1>
        
        <div class="editor-container">
            <div class="file-upload">
                <input type="file" id="file-input" accept=".py,.txt" style="display: none;">
                <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">Upload File</button>
                <button class="btn btn-run" id="run-btn">Run Code</button>
            </div>
            
            <textarea id="code-editor" spellcheck="false"># Enter your Python code here
print("Hello World!")</textarea>
            
            <div id="terminal">
                <div class="terminal-line">Output will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        // File upload handler
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('code-editor').value = e.target.result;
                };
                reader.readAsText(file);
            }
        });

        // Run code handler
        document.getElementById('run-btn').addEventListener('click', async function() {
            const code = document.getElementById('code-editor').value;
            const terminal = document.getElementById('terminal');
            
            // Clear terminal and show loading message
            terminal.innerHTML = '<div class="terminal-line">$ Running code...</div>';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code: code })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    terminal.innerHTML += `<div class="terminal-line">${result.output}</div>`;
                } else {
                    terminal.innerHTML += `<div class="terminal-line" style="color:#ff6b6b">Error: ${result.output}</div>`;
                }
            } catch (error) {
                terminal.innerHTML += `<div class="terminal-line" style="color:#ff6b6b">Connection error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
