<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visual Bot Hosting</title>
  <style>
    body {
      margin: 0; font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1c2c, #2f3145);
      color: #fff; display: flex; flex-direction: column;
      align-items: center; padding: 40px;
    }
    h1 { font-size: 28px; margin-bottom: 20px; }
    .card {
      background: rgba(255,255,255,0.05); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 24px; width: 100%; max-width: 600px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .btn {
      padding: 10px 20px; font-size: 16px;
      border: none; border-radius: 6px; cursor: pointer;
      margin: 5px; color: white;
    }
    .upload-btn { background: #4e9af1; }
    .start-btn { background: #28a745; }
    .stop-btn { background: #dc3545; }
    .hidden { display: none; }
    .timer { margin-top: 10px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>⚡ Visual Bot Hosting</h1>
  <div class="card">
    <input type="file" id="fileInput" accept=".py" style="color:white; background:none;"/>
    <button class="btn upload-btn" onclick="upload()">Upload Python Bot</button>
    <div id="actions" class="hidden">
      <button class="btn start-btn" onclick="startBot()">▶️ Start</button>
      <button class="btn stop-btn" onclick="stopBot()">🛑 Stop</button>
      <div class="timer">⏱️ Running Time: <span id="timer">0</span> sec</div>
    </div>
  </div>

  <script>
    let timer = 0;
    let interval;

    async function upload() {
      const file = document.getElementById("fileInput").files[0];
      if (!file || !file.name.endsWith(".py")) return alert("Upload a .py file");

      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });

      const result = await res.json();
      if (result.status === "success") {
        document.getElementById("actions").classList.remove("hidden");
        alert("✅ File uploaded! Ready to start.");
      } else {
        alert("❌ Upload failed.");
      }
    }

    async function startBot() {
      const res = await fetch("/start", { method: "POST" });
      const result = await res.json();
      if (result.status === "started") {
        alert("✅ Bot started!");
        startTimer();
      } else {
        alert("⚠️ Already running or error.");
      }
    }

    async function stopBot() {
      const res = await fetch("/stop", { method: "POST" });
      const result = await res.json();
      if (result.status === "stopped") {
        alert("🛑 Bot stopped.");
        stopTimer();
      } else {
        alert("⚠️ Bot not running.");
      }
    }

    function startTimer() {
      timer = 0;
      document.getElementById("timer").innerText = timer;
      interval = setInterval(() => {
        timer++;
        document.getElementById("timer").innerText = timer;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(interval);
      document.getElementById("timer").innerText = "0";
    }
  </script>
</body>
</html>
